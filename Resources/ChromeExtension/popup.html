<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Valora 下载</title>
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --secondary: #6e6e73; --line: rgba(127,127,127,.25); --accent: #0a84ff; }
    @media (prefers-color-scheme: dark) { :root { --text: #f5f5f7; --secondary: #98989d; --accent: #0a84ff; } }
    * { box-sizing: border-box; }
    body { width: 280px; margin: 0; padding: 0; background: Canvas; color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; }
    .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
    .row + .row { border-top: 1px solid var(--line); }
    .grow { flex: 1; min-width: 0; }
    .title { font-weight: 600; font-size: 14px; }
    .hint { color: var(--secondary); font-size: 11.5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--secondary); flex: none; }
    .dot.on { background: #34c759; }
    .dot.off { background: #ff9500; }
    button { border: 0; background: var(--accent); color: white; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
    button.secondary { background: transparent; color: var(--accent); padding: 0; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="row">
    <span class="dot" id="dot"></span>
    <span class="grow"><span class="title">Valora 下载</span><br><span class="hint" id="status">正在检查…</span></span>
    <button id="open" hidden>打开 Valora</button>
  </div>
  <div class="row">
    <span class="hint grow">仅接管 Google Chrome 的 HTTP(S) 下载。下载总开关关闭时，Chrome 保留自己的下载。</span>
  </div>
  <div class="row">
    <button class="secondary" id="settings">Chrome 扩展设置</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
